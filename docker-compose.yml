version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fanart}
      POSTGRES_USER: ${POSTGRES_USER:-fanart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
      args:
        # Opt-in per deployment (see backend/Dockerfile) — set
        # INSTALL_TIMM_TAGGER=1 in .env before building to enable the
        # heavier 'timm' tagger backend (needs torch).
        INSTALL_TIMM_TAGGER: ${INSTALL_TIMM_TAGGER:-0}
    command: /app/entrypoint.sh
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - HEADLESS_ALLOWED=1
    depends_on:
      - db

  # poller:
  #   build:
  #     context: ./backend
  #     args:
  #       INSTALL_TIMM_TAGGER: ${INSTALL_TIMM_TAGGER:-0}
  #   # The image's ENTRYPOINT (entrypoint.sh) always execs a web server at
  #   # the end, so it's cleared here in favor of poller_entrypoint.sh, which
  #   # waits for postgres + migrates + runs poll_twitter_updates instead.
  #   entrypoint: []
  #   command: ["sh", "/app/poller_entrypoint.sh"]
  #   volumes:
  #     - ./backend:/app
  #     - ./backend/data:/app/data
  #   env_file:
  #     - .env
  #   environment:
  #     - DATABASE_HOST=db
  #     - DATABASE_PORT=5432
  #   depends_on:
  #     - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./.env:/app/.env:ro
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BACKEND_URL=http://web:8000

volumes:
  db_data:

  frontend_node_modules:


