version: '3.8'

# Production compose file for Raspberry Pi hosting with Cloudflare Tunnel.
#
# Prerequisites:
#   1. Build the frontend:
#        docker compose -f docker-compose.prod.yml run --rm frontend-build
#   2. Set in .env:
#        DJANGO_DEBUG=0
#        DJANGO_SECRET_KEY=<strong random key>
#        CLOUDFLARE_TUNNEL_TOKEN=<token from Cloudflare Zero Trust dashboard>
#
# Start:  docker compose -f docker-compose.prod.yml up -d
# Stop:   docker compose -f docker-compose.prod.yml down

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fanart}
      POSTGRES_USER: ${POSTGRES_USER:-fanart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: ./backend
    command: /app/entrypoint.sh
    restart: always
    volumes:
      - ./backend:/app:ro
      - ./backend/data:/app/data
      - staticfiles:/app/staticfiles
      - ./frontend/dist:/app/frontend_dist:ro
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - HEADLESS_ALLOWED=1
      - DJANGO_DEBUG=0
      - FRONTEND_DIST=/app/frontend_dist
    depends_on:
      - db
    # No ports exposed — cloudflared routes traffic internally via Docker network.

  # One-shot service to build the React frontend.
  # Run before first deploy and after any frontend changes:
  #   docker compose -f docker-compose.prod.yml run --rm frontend-build
  frontend-build:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./.env:/app/.env:ro
    command: sh -c "npm install && npm run build"
    profiles:
      - build

  # Cloudflare Tunnel — exposes the app at your configured public hostname
  # without requiring any port forwarding on the router.
  # Configure the tunnel's Public Hostname in Zero Trust dashboard to: http://web:8000
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  db_data:
  frontend_node_modules:
  staticfiles:
