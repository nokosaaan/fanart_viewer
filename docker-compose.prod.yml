version: '3.8'

# Production compose file for Raspberry Pi hosting with Cloudflare Tunnel.
#
# Prerequisites:
#   1. Build the frontend:
#        docker compose -f docker-compose.prod.yml run --rm frontend-build
#   2. Set in .env:
#        DJANGO_DEBUG=0
#        DJANGO_SECRET_KEY=<strong random key>
#        CLOUDFLARE_TUNNEL_TOKEN=<token from Cloudflare Zero Trust dashboard>
#
# Start:  docker compose -f docker-compose.prod.yml up -d
# Stop:   docker compose -f docker-compose.prod.yml down

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fanart}
      POSTGRES_USER: ${POSTGRES_USER:-fanart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
      args:
        # Opt-in per deployment (see backend/Dockerfile) — set
        # INSTALL_TIMM_TAGGER=1 in .env before building on hardware that can
        # afford torch's disk/RAM cost, leave unset (0) on the Pi.
        INSTALL_TIMM_TAGGER: ${INSTALL_TIMM_TAGGER:-1}
    command: /app/entrypoint.sh
    restart: always
    volumes:
      - ./backend/data:/app/data
      - staticfiles:/app/staticfiles
      - ./frontend/dist:/frontend_dist:ro
    env_file:
      - .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - HEADLESS_ALLOWED=1
      - DJANGO_DEBUG=0
      - FRONTEND_DIST=/frontend_dist
      # Drive backup/restore run pg_dump/psql over the full item_previewimage
      # table (several GB of bytea) on Pi hardware; give gunicorn workers
      # enough room to outlast drive_backup.DUMP_TIMEOUT (1800s) plus upload time.
      - GUNICORN_TIMEOUT=1900
    depends_on:
      - db
    # No ports exposed — cloudflared routes traffic internally via Docker network.

  # poller:
  #   build:
  #     context: ./backend
  #     args:
  #       INSTALL_TIMM_TAGGER: ${INSTALL_TIMM_TAGGER:-1}
  #   # See docker-compose.yml's poller service for why entrypoint is cleared.
  #   entrypoint: []
  #   command: ["sh", "/app/poller_entrypoint.sh"]
  #   restart: always
  #   volumes:
  #     - ./backend/data:/app/data
  #   env_file:
  #     - .env
  #   environment:
  #     - DATABASE_HOST=db
  #     - DATABASE_PORT=5432
  #     - DJANGO_DEBUG=0
  #   depends_on:
  #     - db

  # One-shot service to build the React frontend.
  # Run before first deploy and after any frontend changes:
  #   docker compose -f docker-compose.prod.yml run --rm frontend-build
  frontend-build:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./.env:/app/.env:ro
    command: sh -c "npm install && npm run build"
    profiles:
      - build

  # Cloudflare Tunnel — exposes the app at a public URL without port forwarding.
  #
  # Quick Tunnel mode (no domain/token required):
  #   Uses trycloudflare.com — URL changes on every restart.
  #   Check the URL in logs: docker compose -f docker-compose.prod.yml logs cloudflared
  #
  # Named Tunnel mode (fixed URL, requires Cloudflare domain + token):
  #   Set CLOUDFLARE_TUNNEL_TOKEN in .env and change command to:
  #   command: tunnel --no-autoupdate run
  #   Then uncomment the environment section below.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate --url http://web:8000
    # environment:
    #   - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  db_data:
  frontend_node_modules:
  staticfiles:
