name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fanart
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fanart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Django check
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
        run: |
          python backend/manage.py check || true

      - name: Build Dockerfiles (validate)
        run: |
          docker build -f frontend/Dockerfile -t fanart-frontend-test .
          docker build -f backend/Dockerfile -t fanart-backend-test . || true
